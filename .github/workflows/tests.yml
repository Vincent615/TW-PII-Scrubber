# 注意:此 workflow 於首次 push 前尚未在真實 GitHub Actions 環境驗證過,
# 若首跑失敗請開 issue 或直接修正。
name: tests

on:
  push:
    branches: [main]
  pull_request:

env:
  PYTHONUTF8: "1"

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: 快取 CKIP 模型
        uses: actions/cache@v4
        with:
          path: models
          key: ckip-bert-base-chinese-ner-50c5afc0-${{ runner.os }}
      - name: 安裝相依
        run: pip install -r requirements-dev.txt
      - name: 下載模型(未命中快取時)
        shell: bash
        run: |
          if [ ! -f "models/ckiplab/bert-base-chinese-ner/config.json" ]; then
            python scripts/download_models.py
          fi
      - name: 執行測試
        run: python -m pytest tests/
